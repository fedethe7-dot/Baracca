<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baracca</title>
  <meta name="description" content="Inventario degli attrezzi, lista delle cose da comprare e manutenzione degli attrezzi da giardino.">
  <meta name="theme-color" content="#0e1014">
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="icon" href="icona-baracca.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icona-baracca-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // applica subito tema e colore salvati (evita il lampo)
    try {
      const t = localStorage.getItem('baracca-tema') || 'dark';
      if (t !== 'auto') document.documentElement.dataset.theme = t;
      const c = JSON.parse(localStorage.getItem('baracca-colore-css') || 'null');
      if (c) for (const k in c) document.documentElement.style.setProperty(k, c[k]);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btnBack" aria-label="Indietro" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="pageTitle">Baracca</h1>
    <button class="icon-btn" id="btnSync" aria-label="Sincronizza" hidden></button>
    <button class="icon-btn" id="btnTheme" aria-label="Temi e colori">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
    </button>
      <button class="icon-btn" id="btnAltro" aria-label="Altro"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
  </header>

  <main id="view" class="view"></main>

  <nav class="bottomnav">
    <a href="#home" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </a>
    <a href="#inventario" data-nav="inventario">
      <svg viewBox="0 0 24 24"><path d="M3 8h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zM8 8V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3M3 13h18M10 13v2h4v-2"/></svg>
      <span>Inventario</span>
    </a>
    <button class="fab" id="btnAdd" aria-label="Aggiungi">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#comprare" data-nav="comprare">
      <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
      <span>Comprare</span>
    </a>
    <a href="#manutenzione" data-nav="manutenzione">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.6 17.2a1.6 1.6 0 0 0 2.3 2.3l5.7-5.7a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.1-.5-.5-2.1z"/></svg>
      <span>Manutenzione</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="db.js"></script>
  <script src="util.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
